# Visit the live site like a member would and check the main pages work
# (read-only: no sign-ups or payments). Runs after Checks finishes on main (by
# then Vercel has usually deployed that push), once a day, and by hand.
# Vercel doesn't report deploys to GitHub for this repo, so deployment_status never fires.
name: Live site check

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check meetwell.me
        run: npx playwright test
        env:
          BASE_URL: https://meetwell.me
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
